name: Release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure scripts are executable
        run: chmod +x ./gradlew ./build-local.sh ./tools/*.sh

      - name: Validate repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./tools/check.sh

      - name: Prepare public release build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./build-local.sh

      - name: Install release dependencies
        run: npm ci

      - name: Capture current public version
        id: previous_version
        run: echo "version=$(jq -r '.version' patches-bundle.json)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npx semantic-release

      - name: Verify GitHub release
        env:
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_VERSION="$(jq -r '.version' patches-bundle.json)"

          if [[ "$NEW_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "No new release was created."
            exit 0
          fi

          gh release view "v$NEW_VERSION" >/dev/null
          echo "GitHub release v$NEW_VERSION exists."

      - name: Attest built bundle
        if: ${{ hashFiles('patches/build/libs/patches-*.mpp') != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: patches/build/libs/patches-*.mpp

      - name: Publish personal source
        if: ${{ github.ref_name == 'main' }}
        env:
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NEW_VERSION="$(jq -r '.version' patches-bundle.json)"

          if [[ "$NEW_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "No new stable release; personal source is unchanged."
            exit 0
          fi

          ./tools/publish-personal-bundle.sh "$NEW_VERSION"

      - name: Remove legacy releases containing the personal patch
        if: ${{ github.ref_name == 'main' }}
        env:
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_VERSION="$(jq -r '.version' patches-bundle.json)"

          if [[ "$NEW_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "No new stable release; legacy releases are unchanged."
            exit 0
          fi

          for tag in \
            keepcool-availability-dots-test.1 \
            v1.1.0 \
            v1.1.1 \
            v1.2.0
          do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes
              echo "Deleted release $tag (tag preserved)."
            fi
          done
